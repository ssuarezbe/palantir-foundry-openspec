name: foundry-spec-driven
version: 2
description: Foundry workflow - proposal → specs, design, ontology, data and logic → tasks. Adds glossary, Ontology, logic, data and an open questions log.
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<capability-path>/spec.md`. Name each capability for a durable system behavior (for example, `user-auth`), not the work in this change (for example, `add-login-endpoint`). Choose a cohesive boundary that can own related requirements as the system evolves; avoid broad catch-all capabilities. Use kebab-case for path segments you introduce (e.g., `user-auth` or `identity/user-auth`) and follow the project's existing spec organization.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Use the exact existing path under `openspec/specs/`. Leave empty if no requirement changes.
      - **Glossary changes**: New or changed domain terms. Check `openspec/glossary.md` first and use its terms verbatim. Add every new domain noun to the glossary in this same change. A term is a business concept: give the Ontology resources (object types, link types, action types) that represent it, one or several, or "not modelled". Write "None" if there are no changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      Also create `open-questions.md` now (see that artifact). Record every gap you could not close while writing the proposal.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in:
      run `openspec list --specs` for the project's capability inventory, then
      `openspec show "<spec-id>" --type spec --json --no-scenarios` for any that
      look related - that returns a capability's purpose and requirement texts
      without pulling whole spec files into context. Append `--store "<id>"` to
      both commands only for a registered standalone store, and keep `--type
      spec`: a change and a spec sharing a name is otherwise an ambiguous-item
      error. `openspec list` without `--specs` lists in-flight changes, not
      specs - it never shows what the project already covers. Reuse an existing
      capability's exact path instead of introducing a near-duplicate name.
      The filtered read is only an overview. Before deciding what is already
      covered or what should change, read each relevant spec in full, including
      scenarios, with `openspec show "<spec-id>" --type spec` (same `--store` rule).
      Each capability listed here will need a corresponding spec file.

      Every change must either declare at least one capability (new or
      modified) or explicitly opt out of specs: `openspec validate` rejects a
      change with zero deltas unless the change's `.openspec.yaml` sets
      `skip_specs: true`. Use `skip_specs: true` only when no spec-level
      behavior changes (pure refactor, tooling, docs) - specs describe
      behavior, so if behavior does not change, no spec should change either.
      Do not invent a requirement just to satisfy validation.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.

      This is the foundation - specs, design, and tasks all build on this.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      A spec is a behavior contract, not an implementation plan.

      Good spec content:
      - Observable behavior users or downstream systems rely on
      - Inputs, outputs, and error conditions
      - External constraints (security, privacy, reliability, compatibility)
      - Scenarios that can be tested or explicitly validated

      Avoid in specs:
      - Internal class/function names
      - Library or framework choices
      - Step-by-step implementation details
      - Detailed execution plans (those belong in design.md or tasks.md)

      Quick test: if the implementation can change without changing externally
      visible behavior, it likely does not belong in the spec.

      Foundry rules:
      - Use terms from `openspec/glossary.md` verbatim. Never use a term listed as a forbidden synonym.
      - When a requirement reads or changes an Ontology object type or action type, add one line under the requirement text: `Ontology: <ApiName>`, or several names separated by commas when the behavior touches several object, link or action types. Use the API names exactly. Do not redefine the object type in the spec.
      - Leave the line out when the requirement touches no Ontology resource.
      - When more than one repository or Foundry resource implements the requirement, add one line: `Implemented in: <ontology action, function, app>`. Name each place. Omit it for a single-repository project.

      - A glossary term (business concept) is not an Ontology resource. One term can map to several object types and link types, and one object type can serve several terms. Write the behavior in glossary terms and list the resources on the `Ontology:` line.
      - Every `Ontology:` name must be an existing Ontology resource or appear in `ontology.md` or `logic.md` of this change.
      - Add a row to `open-questions.md` (stage `specs`) for every behavior you could not specify, instead of guessing.

      Gherkin scenarios:
      - Write every scenario in Gherkin keyword form, one step per line, keywords in bold capitals: `- **GIVEN** <context>`, `- **WHEN** <one trigger>`, `- **THEN** <observable outcome>`. Continue a step with `- **AND** ...` or `- **BUT** ...`. Keep the English keywords, because validation looks for them. The step text may be in any language.
      - One behavior per scenario. Exactly one WHEN. GIVEN states context only. THEN states what an observer sees (a status, a message, a recorded value), not how the code does it.
      - Use business language and glossary terms. No clicks, field ids, function names or API calls.
      - Same steps with different data? Write one scenario with `<placeholder>` in the steps and an `**Examples**` table right after the steps: a header row naming each placeholder, one row per case.
      - There is no Background. Put context that every scenario shares in the requirement text, or repeat the GIVEN.
      - Cover the main path, each rule the requirement states, and at least one failure case.

      Create one spec file per capability listed in the proposal's Capabilities section.
      `<capability-path>` is the spec directory relative to `specs/` (for example,
      `user-auth` or `identity/user-auth`). Preserve the full path:
      - New capabilities: use the exact path from the proposal at `specs/<capability-path>/spec.md`. Any path segment newly introduced in the proposal must be kebab-case. Follow the project's existing organization; do not add a new domain level when the project uses a flat layout.
      - Modified capabilities: use the exact existing path from `openspec/specs/<capability-path>/` when creating the delta at `specs/<capability-path>/spec.md`. Run `openspec list --specs` to confirm that path before writing the delta, appending `--store "<id>"` only for a registered standalone store - a mistyped or invented path targets a capability that does not exist rather than the one you meant. Do not move or rename the capability.

      Write the spec files one at a time, so the user sees progress and an
      interrupted run keeps the files it already wrote:
      - Before writing anything, compare the capabilities the proposal lists
        with the `specs/<capability-path>/spec.md` files that already exist,
        and start with the first capability that has no file. Do not rewrite
        an existing file unless the user asks you to.
      - Before each file, say in one line which capability you are writing.
      - Write each file as soon as you have drafted it. Do not plan every file
        before writing the first.
      - Stop when every capability the proposal lists has its file.

      There must be at least one spec file unless the change's `.openspec.yaml`
      sets `skip_specs: true` (no spec-level behavior change) - `openspec validate`
      rejects a zero-delta change without that marker. If the proposal lists no
      capabilities and `skip_specs` is not set, revisit the proposal first.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.
      - Every scenario MUST have a WHEN/GIVEN step (its trigger) and a THEN step (its outcome). A scenario with only AND lines or plain prose still counts as a scenario, but `openspec validate` flags it as a warning: normal validation still passes, but `openspec validate --strict` fails on it.
      - Keep each requirement's description (the text between `### Requirement:` and its first scenario) to 500 characters or fewer. `openspec validate` flags longer descriptions in ADDED requirements and in the main spec. This is a warning: normal validation still passes, but `openspec validate --strict` fails on it. When writing a new requirement, state one behavior per requirement: move examples and edge cases into scenarios, and split a requirement that covers several behaviors into separate `### Requirement:` blocks, each with its own scenarios. Under MODIFIED, keep the existing requirement block whole; never split, trim or rewrite existing text just to meet the length. Split an existing long requirement only when the user asks for it, in a change made for that purpose: under MODIFIED, keep its header and every scenario and cut its description down to one behavior without changing its meaning, then add each behavior you removed as its own ADDED requirement with its own scenarios.

      New capabilities only: the delta spec's first section is `## Purpose` -
      one or two sentences (50+ characters, or `openspec validate --strict`
      reports it as too brief) describing what the capability is for. Archive
      copies it into the main spec it creates; without it the new main spec is
      left with a `TBD ... Update Purpose after archive` placeholder to fill in
      by hand. Do NOT add `## Purpose` to a delta for an existing capability -
      that spec already has one and the delta's is ignored. To change an
      existing capability's Purpose - including a leftover `TBD` placeholder -
      edit `<planningHome.root>/openspec/specs/<capability-path>/spec.md`
      directly. `planningHome.root` comes from the `openspec instructions ...
      --json` response. Always use it rather than a repo-relative path: it
      resolves to the store whenever the change lives in one - whether that
      came from `--store`, a project `store:` pointer, or a global default
      store - and to the current repository otherwise. Do not try to work out
      which case applies; the field already has.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in `<planningHome.root>/openspec/specs/<capability-path>/spec.md` (the same store-aware root as above)
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example (a new capability, so its first section is `## Purpose`):
      ```
      # Spec Delta

      ## Purpose

      Lets users take their data out of the product in a portable format.

      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      When to include design.md (create only if any apply):
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections:
      - **Context**: Only the current state and constraints needed to explain the approach. Reference the proposal for motivation instead of restating it (e.g., "See proposal.md - Why").
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes. Don't restate the proposal's scope - add only design-level boundaries.
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered for each decision.
      - **Foundry resources**: A short summary with pointers to `ontology.md`, `logic.md` and `data.md`. Do not repeat their tables. Write "None" if the change touches no Foundry resource.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)

      Do not write an Open Questions section here. Record every unknown as a row in `open-questions.md` (stage `design`).
      Mark it Blocking = yes if the answer would change the specs, the chosen approach, or the task breakdown, and ask the user instead of guessing.

      Focus on architecture and approach, not line-by-line implementation.
      The proposal covers why and what; design covers how. Reference the
      proposal for motivation and, once written, the specs for requirements -
      if a section would only restate them, point to them instead.

      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal

  - id: ontology
    generates: ontology.md
    description: Object types, link types and access this change adds, changes or reads
    template: ontology.md
    instruction: |
      Create the Ontology document: the data model this change touches.

      First read `openspec/ontology-design.md` and apply it. It holds Palantir's Ontology design rules: naming, object type granularity, properties and primary keys, structs, links, interfaces, security, governance and the anti-patterns. Then check your model against it and fill the "Design review" table with every rule you break, the reason and when you will revisit it. Write "No deviations" if none. Reject the anti-patterns: system silos, department silos, kitchen sink, god object, golden hammer, action sprawl, time machine, misnomer.

      - Scope: the Ontology (space) name, private or shared, whether it is packaged in Marketplace, and who owns the core types. An Ontology maps 1:1 to a space, and links cannot cross Ontologies.

      - List every object type, link type and access rule the change adds, changes or reads. Use the API name exactly as in Ontology Manager. Confirm each existing name with the Ontology tools you have, `openspec/ontology.json` if present, or the user.
      - Status is `new`, `changed` or `read`. For `read`, give only the API name and why it is needed. Do not redefine existing types.
      - Give the glossary term on every object type, link type and action row. A business concept can need several object types and link types: list each one with the same term. Write "not modelled" if no term fits. If the concept is new, add its term to `openspec/glossary.md` in this change. The glossary row for a term must list every resource that represents it.
      - For a new or changed object type: primary key, backing dataset (it must appear in `data.md`) and properties with types.
      - Use API names, never RIDs: RIDs differ between environments. Give each object type a display name and a one-sentence description so people and agents can find it. Name overlapping concepts once: if two object types look alike, say how they differ or merge them.
      - For each property, give the unit, and the date or aggregation rule where it matters. Unclear granularity, units or dates give inconsistent answers.
      - For a link type: the API name of each side, both ends, cardinality, status, and how it is stored. A one-to-one or one-to-many link is a foreign key property on one object type. A many-to-many link needs a join dataset, which must appear in `data.md`. Use an object-backed link type when the relationship has data of its own. A link reflects a real business relationship, not a source-system join.
      - Interfaces and shared properties: list any shape that several object types implement, and any property whose metadata is managed once. Write "None" if unused.
      - Value types: list reusable semantic types with their constraint in words. Write "None" if unused.
      - Choose the primary key type with care: String, Integer or Short are preferred. Mark derived and denormalized properties and give the source of truth.
      - Questions this model must answer: list the business questions, each as situation, contributing factors, impact, with the object and link types used. Write at least one spec scenario for each. A manual export or join that people rely on today usually means a missing link.
      - Access: markings, restricted views, row-level and column-level rules, roles. Say who is covered: users, groups and AI agents (agents inherit permissions from the user or project). Write "Unchanged" if none.
      - Write "None" under a heading with nothing to record. If the change touches no Ontology resource, every heading says "None".
      - Add a row to `open-questions.md` (stage `ontology`) for every name, key, type or rule you could not confirm.

      Keep it a model, not an implementation: no transform code, no function bodies.
    requires:
      - proposal

  - id: data
    generates: data.md
    description: Datasets, transforms and data quality checks this change adds, changes or reads
    template: data.md
    instruction: |
      Create the data document: where data comes from and how it reaches the Ontology.

      - Datasets: name, kind (dataset, virtual table or model), status (`new`, `changed`, `read`), source system or upstream dataset, columns with types, update cadence, owner team.
      - Transforms and pipelines: name, tool (Pipeline Builder, Python, SQL), inputs, outputs, trigger or schedule.
      - Data quality: one row per check (for example not-null on a primary key, freshness) with its threshold in words.
      - Every dataset that backs an object type in `ontology.md` appears here.
      - No credentials, connection strings or customer data. Name sources by system, not by secret.
      - Write "None" under a heading with nothing to record.
      - Add a row to `open-questions.md` (stage `data`) for every unknown source, column or cadence.
    requires:
      - proposal

  - id: logic
    generates: logic.md
    description: Actions, functions and AIP Logic this change adds, changes or reads
    template: logic.md
    instruction: |
      Create the logic document: the behavior that changes the Ontology or reads it.

      First read `openspec/ontology-design.md` (sections 6 and 7). Design actions around business operations, not single properties. Choose actions for decisions, pipelines for batch and streaming data work, automations for events, and functions for live complex logic.

      - Actions: API name, the object and link types it edits (they must be in `ontology.md` or exist), parameters, the rules it uses (create, modify, delete, link, function), submission criteria in words (who may run it and what must be true), side effects (notification, webhook, schedule), status (`new`, `changed`, `read`). Rules compile into one edit per object, so order matters. A function rule cannot be combined with other rules. Link rules work for many-to-many links only: change a one-to-many link through its foreign key property. Byte, float and short properties cannot be action parameters.
      - Functions: API name, language (TypeScript or Python), inputs, output, kind (business rule, model, LLM-driven or orchestration), what it reads, the edits it returns (create, update, delete, link) per object type, who uses it, status. A function that edits changes nothing by itself: it takes effect only through a function-backed action, so name that action. Automate does not apply edits returned by a function: use an action. Object set queries inside the function read values from before its edits.
      - Writeback: for every change that must reach a system outside Foundry, name the action or function, the target system, the mechanism (webhook, change data capture or other) and what happens when the target is down. Write "None" if the Ontology is the only record.
      - AIP Logic and agents: name, input, output, the tools it may call (functions, actions, Ontology queries), whether a human reviews before it writes, and its evaluation cases. Cite spec scenarios as evaluation cases, for example `scenario "<name>" of <capability>`. An AIP Logic function that writes to the Ontology must go through an action.
      - Write "None" under a heading with nothing to record.
      - Add a row to `open-questions.md` (stage `logic`) for every unknown parameter, rule or tool.

      Describe behavior contracts, not code. Scenarios stay in the specs.
    requires:
      - ontology

  - id: open-questions
    generates: open-questions.md
    description: Log of knowledge gaps and open questions across every artifact
    template: open-questions.md
    instruction: |
      Create and keep the open questions log. One row per knowledge gap.

      - Create it with the proposal. Seed it with every gap you found while writing the proposal. If there are none, keep the table with no rows below the header and say "No open questions" under it.
      - Columns: ID (`Q1`, `Q2`, never reused), Stage (proposal, specs, design, ontology, logic, data, tasks, apply), Question, Blocking (`yes` when the answer would change the specs, the approach, the Foundry resources or the tasks; else `no`), Affects (a file or capability), Owner (who can answer), Status, Answer.
      - Status is `open`, `answered`, `assumed` or `dropped`. `assumed` means work continued on a stated assumption: write the assumption in Answer. Write the date in Answer when you set a status.
      - Every later artifact adds rows for its own gaps. Never delete a row. Change its Status and fill Answer.
      - Ask the user to answer rows that are Blocking = yes and Status = open. Do not write tasks while any such row is open.
      - Do not invent answers. A gap you cannot close is a row, not a guess.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      Before writing tasks, read `open-questions.md`. If any row is Blocking = yes and Status = open, stop and ask the user to answer it first - do not
      bake an unstated assumption into the task list. Add a row for any new gap you find (stage `tasks`).

      **IMPORTANT: Follow the template below for tracked tasks.** The apply phase parses
      checkbox format to track progress. A box holding only `x` counts as done,
      upper or lower case and with any spacing, so `- [ x]` is done too. Every
      other marker, including `- [~]`, `- [-]` and an empty `- []`, reads as
      unfinished. A line with no checkbox is not tracked at all.

      Guidelines:
      - Group related tracked tasks under ## numbered headings
      - When the change spans several repositories or Foundry resources, make one group per repository (or resource) and order the groups by dependency: Ontology first, then functions, then apps that use the regenerated SDK. Name the repository in the group heading.
      - Each tracked task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?). For Foundry work the usual order is: datasets and transforms, object and link types, actions, functions, AIP Logic, then apps. Every new or changed resource in `data.md`, `ontology.md` and `logic.md` needs at least one task.
      - Track implementation and verification work that can be completed before
        archive. If the requested workflow includes archive or work that requires
        this change to be archived, preserve those steps as plain bullets in an
        optional `## Workflow follow-up` section at the end of tasks.md. These
        bullets are reference information outside tracked task progress.
      - Each task MUST state how to verify completion (a test, command,
        observable behavior, or delivered artifact). Put the verification in
        that task's checkbox description. Use a separate verification task only
        when it checks broader integration or system behavior that spans
        multiple implementation tasks.
      - Foundry rule: write each task's verification as one indented line under the checkbox, in Gherkin form: `  - **Verify:** GIVEN <state>; WHEN <action>; THEN <result>.` When a spec scenario already says it, cite the scenario instead: `  - **Verify:** scenario "<scenario name>" of <capability>.` A Verify line is not a checkbox and is not counted as a task.
      - Each task group MUST land the tests and documentation its own work
        calls for. Do NOT collect testing or documentation into a final group -
        when a late group first exercises work from an early one, the failures
        cascade back through every group in between and force rework. A group
        whose work calls for neither, such as scaffolding or dependency setup,
        carries neither. A final group is for integration checks only, not for
        the tests and docs an earlier group owed.

      Example:
      ```
      # Tasks

      ## 1. Setup

      - [ ] 1.1 Create new module structure and verify expected files are present
      - [ ] 1.2 Add dependencies to package.json and verify package installation succeeds

      ## 2. Core Implementation

      - [ ] 2.1 Implement data export function and verify the export test passes
      - [ ] 2.2 Add CSV formatting utilities and verify unit tests cover quoting and delimiters
      - [ ] 2.3 Document the export API in docs/export.md and verify the documented command runs as written
      ```

      When applicable, append workflow follow-up as plain bullets, for example:
      ```
      ## Workflow follow-up

      - Archive the change after the project's review requirements are satisfied.
      - Verify the archived result.
      ```

      Reference specs for what needs to be built, design for how to build it.
    requires:
      - specs
      - design
      - ontology
      - data
      - logic
      - open-questions

apply:
  requires: [ tasks ]
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification. Stop if any row in open-questions.md is Blocking = yes and Status = open. Add a row for any new gap.
